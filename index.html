<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
:root{--bg:#0A041A;--card:#150B2E;--card-2:#1B1038;--line:#271849;--text:#F4F2F8;--muted:#AAA0C1;--accent:#F79009;--accent-soft:rgba(247,144,9,.14);--accent-soft-line:rgba(247,144,9,.3);--btn-text:#0A041A;--white-seg:#3A2C5C;--track:#241539;--green:#5FC787;--green-soft:rgba(95,199,135,.14);--green-soft-line:rgba(95,199,135,.32);--red:#E2685C;--shadow:0 28px 64px -30px rgba(0,0,0,.65);--shadow-sm:0 10px 26px -16px rgba(0,0,0,.55)}
[data-theme="light"]{--bg:#F3F1F9;--card:#ffffff;--card-2:#FBFAFD;--line:#E7E2F1;--text:#170B33;--muted:#756B91;--accent:#F79009;--accent-soft:rgba(247,144,9,.1);--accent-soft-line:rgba(247,144,9,.28);--btn-text:#170B33;--white-seg:#EAE5F3;--track:#EFEBF7;--green:#3E9C64;--green-soft:rgba(62,156,100,.1);--green-soft-line:rgba(62,156,100,.28);--red:#D34C40;--shadow:0 24px 50px -26px rgba(30,15,60,.16);--shadow-sm:0 10px 24px -16px rgba(30,15,60,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--card);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;-webkit-font-smoothing:antialiased}
body{padding:28px 14px;display:flex;justify-content:center}
.card{background:linear-gradient(165deg,var(--card-2) 0%,var(--card) 60%);border:none;border-radius:0;padding:22px 18px;width:100%;max-width:720px;box-shadow:none}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px}
h1{font-weight:800;font-size:24px;margin:0;letter-spacing:-.02em}
.month-row{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;margin:0 -8px 12px;padding:8px;flex-wrap:wrap;background:var(--card);box-shadow:0 10px 18px -18px rgba(23,11,51,.42)}
.month-select{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--text);font-weight:700;font-size:13px;letter-spacing:.01em;padding:9px 10px;flex:1;min-width:0}
.month-menu{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.month-menu svg{display:block}
#status{font-size:12px;color:var(--muted)}
#status.err{color:var(--red)}
.chart-col{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:22px;margin-bottom:12px}
.chart-svg-wrap{flex:0 1 auto}
.chart-svg-wrap svg{display:block;cursor:pointer;transform-origin:center;will-change:transform}
.chart-side{display:flex;flex-direction:column;gap:16px;flex:1;min-width:0;transition:opacity .2s ease}
.chart-col.expanded .chart-svg-wrap{flex-basis:100%;display:flex;justify-content:center}
.chart-col.expanded .chart-svg-wrap svg{width:230px;height:230px}
.chart-col.expanded{row-gap:8px}
.chart-side.expanded{display:none}
.chart-side.expanded .side-block{flex:0 1 150px;align-items:center}
.chart-side.expanded .side-income{display:none}
.chart-side.expanded .binp{text-align:center}
.chart-side{transition:opacity .2s ease,transform .2s ease}
.period-tabs{display:none;justify-content:center;width:100%;margin:24px 0 14px;padding:0 2px}
.period-tabs.show{display:flex}
.period-tabs-track{display:flex;gap:2px;width:100%;background:var(--track);border-radius:12px;padding:3px}
.period-tabs button{flex:1;min-width:0;background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;padding:7px 12px;border-radius:9px;transition:background .2s ease,color .2s ease}
.period-tabs button.active{color:var(--text);background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chart-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;padding:2px 2px;max-height:0;opacity:0;overflow:hidden;transition:max-height .4s ease,opacity .3s ease,margin .4s ease}
.chart-legend.open{max-height:900px;opacity:1;margin:4px 0 16px}
.others-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-tile{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 10px;border-radius:13px;min-width:0}
.cat-tile-other{cursor:pointer;border:none;width:100%;text-align:left;font:inherit}
.cat-tile-name{font-size:12px;font-weight:700;color:var(--tile-text,var(--text));overflow:hidden;white-space:nowrap;flex:1;min-width:0;-webkit-mask-image:linear-gradient(to right,#000 70%,transparent 100%);mask-image:linear-gradient(to right,#000 70%,transparent 100%)}
.cat-tile-amt{font-size:12px;font-weight:800;color:var(--tile-text,var(--text));font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.cat-tile-pct{font-size:12px;font-weight:700;color:var(--tile-text,var(--text));opacity:.86;margin-left:3px}
.chart-side{display:flex;flex-direction:column;gap:16px;flex:1;min-width:0}
.side-block{display:flex;flex-direction:column;gap:5px}
.side-label{font-size:12px;color:var(--muted);letter-spacing:.02em;font-weight:700}
.side-value{font-size:21px;line-height:1;font-weight:800;color:var(--text);padding:4px 0;letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:inline-block}
.income-row{display:flex;gap:6px}
.income-input{background:var(--green-soft);border:1px solid var(--green-soft-line);border-radius:12px;color:var(--text);font-family:inherit;font-size:14px;padding:0 10px;width:0;min-width:0;height:44px;flex:1;display:none;text-align:center}
.income-input.show{display:block}
.income-input::placeholder{color:var(--green)}
.income-btn{display:flex;align-items:center;justify-content:center;background:var(--green-soft);border:1px solid transparent;color:var(--green);font-family:inherit;font-weight:700;font-size:14px;padding:0 14px;border-radius:12px;flex-shrink:0;white-space:nowrap;width:100%;height:44px;transition:background .18s ease,transform .12s ease,width .18s ease}
.income-btn:active{transform:scale(.99)}
.income-input.show ~ .income-btn,.income-btn.confirm{width:44px;padding:0;font-size:18px;border-color:var(--green-soft-line)}
.side-value.neg{color:var(--red)}
svg{overflow:visible}
.binp{background:none;border:none;color:var(--text);font-weight:800;font-size:21px;line-height:1;padding:4px 0;width:100%;max-width:150px;cursor:default;letter-spacing:-.01em;font-family:inherit;font-variant-numeric:tabular-nums}
.binp:focus{outline:none}
.row{padding:13px 0;border-bottom:1px solid var(--line)}
.row-top{display:grid;grid-template-columns:12px minmax(0,1fr) 88px 44px 44px;align-items:center;gap:8px;touch-action:pan-y}
@media(max-width:430px){.row-top{grid-template-columns:12px minmax(0,1fr) 72px 44px 44px;gap:6px}}
.row-dragging{opacity:.95;box-shadow:0 10px 24px rgba(0,0,0,.3);border-radius:14px;background:var(--card);pointer-events:none}
.row-spacer{border:2px dashed var(--line);border-radius:12px;margin:2px 0;box-sizing:border-box}
.sw{width:10px;height:10px;border-radius:3px}
.ninp{color:var(--text);font-weight:700;font-size:13px;line-height:1.2;letter-spacing:0;width:100%;min-width:0;padding:3px 2px;overflow:hidden;white-space:nowrap}
.ninp.is-overflowing{-webkit-mask-image:linear-gradient(to right,#000 72%,transparent 100%);mask-image:linear-gradient(to right,#000 72%,transparent 100%)}
.amt-display{font-weight:700;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.pct-input{font-size:12px;color:var(--text);text-align:right;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;width:44px;padding:2px 3px}
.row-expand-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--green-soft-line);background:var(--green-soft);color:var(--green);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0}
.row-expand-btn span{display:block;line-height:1;transition:transform .22s cubic-bezier(.22,1,.36,1)}
.row-expand-btn.open span{transform:rotate(45deg)}
.row-bottom{display:none;flex-direction:column;gap:4px;margin-top:10px}
.row.expanded .row-bottom{display:flex;animation:rowReveal .24s cubic-bezier(.22,1,.36,1)}
@keyframes rowReveal{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.plus-input{background:var(--green-soft);border:1px solid var(--green-soft-line);border-radius:10px;color:var(--text);font-size:14px;padding:9px 10px;width:0;min-width:0;height:40px;text-align:center;display:none;flex:1}
.plus-input.show{display:block}
.plus-input::placeholder{color:var(--green)}
.limit-input{display:none;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:12px;padding:9px 8px;width:92px;height:40px;text-align:center;flex-shrink:0}
.limit-input.show{display:block}
.limit-input.limit-edit{display:block;flex:1;width:0;font-size:14px}
.limit-input::placeholder{color:var(--muted);font-weight:700}
.plus-row{display:flex;align-items:center;gap:6px;width:100%}
.pct-toggle-btn{display:none;background:none;border:1px solid var(--line);color:var(--muted);width:44px;height:44px;border-radius:10px;font-size:14px;font-weight:700;flex-shrink:0}
.pct-toggle-btn.show{display:block}
.pct-toggle-btn.active{background:var(--accent-soft);border-color:var(--accent-soft-line);color:var(--accent)}
.pct-preview{font-size:12px;color:var(--text);font-weight:700;padding:2px 0 0 2px;min-height:16px}
.pct-preview:empty{min-height:0;padding:0}
.hist-toggle-row{display:flex;justify-content:flex-start}
.hist-icon-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.limit-action-btn{width:64px;padding:0 8px;font-family:inherit;font-size:12px;font-weight:700}
.limit-action-btn.limit-confirm{width:44px;padding:0}
.hist-icon-btn.limit-confirm{border-color:var(--green-soft-line);background:var(--green-soft);color:var(--green)}
.row-top .hist-icon-btn{width:44px;height:44px}
.amt-display.over-limit{color:var(--red)}
.limit-bar-wrap{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 0}
.limit-bar{height:100%;background:var(--green);border-radius:3px;transition:width .2s}
.limit-bar.over{background:var(--red)}
.limit-text{font-size:12px;color:var(--muted);margin:4px 0 0}
.limit-text.over{color:var(--red);font-weight:700}
.hist-toggle{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:2px 4px;flex-shrink:0}
.hist{margin-top:6px;padding-left:18px;display:none}
.hist.open{display:block}
.hist-item{display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--muted);padding:6px 0}
.hist-item .hist-top{display:flex;gap:10px;align-items:center}
.hist-item b{color:var(--text);font-weight:600;font-size:14px}
.hist-item .hist-comment{color:var(--muted);font-size:13px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;cursor:pointer}
.hist-item .hist-comment.expanded{white-space:normal;overflow:visible;text-overflow:clip}
.hist-del{background:none;border:none;color:var(--muted);font-size:13px;width:20px;height:20px;border-radius:5px;margin-left:auto;flex-shrink:0}
.add{margin-top:14px;background:var(--accent-soft);border:1px solid var(--accent-soft-line);color:var(--accent);font-weight:700;font-size:13px;padding:12px 12px;border-radius:12px;width:100%;text-align:center}
.bottom-row{display:flex;gap:8px;margin-top:10px}
.head-icons{display:flex;align-items:center;gap:8px}
.icon-btn{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--text);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(6,2,16,.65);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.overlay.open{display:flex}
.sheet{background:linear-gradient(180deg,var(--card-2) 0%,var(--card) 40%);width:100%;max-width:720px;max-height:85vh;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;box-shadow:var(--shadow)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
.backup-option{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;background:none;border-top:none;border-left:none;border-right:none;width:100%}
.backup-option:last-child{border-bottom:none}
.backup-option-icon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text)}
.backup-option-text{flex:1;min-width:0}
.backup-option-title{font-size:14px;font-weight:700;color:var(--text)}
.backup-option-desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.backup-option.danger .backup-option-icon{color:var(--red)}
.period-rename-form{display:none;align-items:center;gap:8px;padding:10px 4px 14px;border-bottom:1px solid var(--line)}
.period-rename-form.open{display:flex}
.period-rename-input{min-width:0;flex:1;height:44px;padding:0 12px;border:1px solid var(--accent-soft-line);border-radius:11px;outline:0;background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-size:14px}
.period-rename-input:focus{border-color:var(--accent)}
.period-rename-save{height:44px;padding:0 15px;border:1px solid var(--accent-soft-line);border-radius:11px;background:var(--accent);color:var(--btn-text);font-family:inherit;font-size:13px;font-weight:800}
.sync-panel{display:none;flex-direction:column;gap:10px;padding:10px 4px 16px;border-bottom:1px solid var(--line)}
.sync-panel.open{display:flex}
.sync-panel .backup-option-desc{margin:0}
.sync-join-row{display:flex;gap:8px}
.sync-join-row .period-rename-input{font-family:inherit}
.sync-code-box{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border:1px solid var(--accent-soft-line);border-radius:11px;background:var(--accent-soft)}
.sync-code-text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:800;letter-spacing:.03em;color:var(--text);word-break:break-all}
.sync-status{font-size:12px;color:var(--muted)}
.sync-status.err{color:var(--red)}
.gh-search{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:13px;padding:9px 10px;margin-bottom:12px}
.gh-search::placeholder{color:var(--muted)}
.gh-month-tag{font-size:12px;color:var(--muted);font-weight:700}
.gh-tags{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.gh-tag{background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;padding:7px 12px;border-radius:20px}
.gh-tag.active{background:var(--accent);color:var(--btn-text);border-color:var(--accent)}
.gh-date-toggle{display:flex;align-items:center;justify-content:center;width:34px;height:32px;margin-left:2px;padding:0;border:1px solid var(--line);border-radius:16px;background:none;color:var(--muted)}
.gh-date-toggle.open,.gh-date-toggle.filtered{border-color:var(--accent-soft-line);background:var(--accent-soft);color:var(--accent)}
.gh-date-filters{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:8px;margin:-4px 0 14px}
.gh-date-filters.open{display:grid}
.gh-date-box{min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035)}
.gh-date-label{display:block;margin-bottom:5px;color:var(--muted);font-size:12px;font-weight:700}
.gh-date-range{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px}
.gh-date-input{min-width:0;width:100%;height:32px;margin:0;border:0;border-radius:7px;outline:0;background:var(--card);color:var(--text);font-family:inherit;font-size:12px;padding:4px 6px;color-scheme:dark}
[data-theme="light"] .gh-date-input{color-scheme:light}
.gh-date-dash{color:var(--muted);font-size:12px}
.gh-date-clear{grid-column:1/-1;justify-self:end;margin-top:-2px;border:0;background:none;color:var(--muted);font-family:inherit;font-size:12px;text-decoration:underline;padding:2px 0}
@media(max-width:430px){.gh-date-filters{grid-template-columns:1fr}.gh-date-clear{grid-column:1}}
.gh-summary{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.035)}
.gh-summary-count{color:var(--text);font-size:13px;font-weight:700}
.gh-summary-totals{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.gh-summary-totals b{color:var(--text);font-weight:700}
.gh-day-title{margin:18px 0 2px;padding-bottom:7px;border-bottom:1px solid var(--line);color:var(--text);font-size:13px;font-weight:800}
.gh-summary + .gh-day-title{margin-top:0}
.sheet-close{background:none;border:none;color:var(--muted);font-size:20px;width:32px;height:32px}
.sheet-export{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.gh-empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0}
.gh-item{border-bottom:1px solid var(--line);padding:10px 0}
.gh-row{display:flex;align-items:center;gap:8px}
.gh-sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.gh-cat{font-size:12px;color:var(--muted);flex-shrink:0}
.gh-date{font-size:12px;color:var(--muted)}
.gh-editrow{display:flex;align-items:center;gap:6px;margin-top:6px}
.gh-amt-input{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;color:var(--text);font-weight:700;font-size:13px;padding:6px 8px;width:90px;text-align:center}
.gh-comment-input{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;padding:6px 8px;flex:1;min-width:0}
.gh-save{background:var(--green-soft);border:1px solid var(--green-soft-line);color:var(--green);font-weight:700;font-size:12px;padding:7px 10px;border-radius:8px;flex-shrink:0}
.gh-del{background:none;border:none;color:var(--muted);font-size:14px;width:26px;height:26px;border-radius:6px;flex-shrink:0}
.gh-edit-icon{font-size:20px;font-weight:700;width:32px;height:32px}
.gh-restore{background:none;border:1px solid var(--green-soft-line);color:var(--green);font-weight:700;font-size:12px;padding:7px 12px;border-radius:8px}
.cat-edit-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cat-swipe-wrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.cat-swipe-content{position:relative;background:var(--card);touch-action:pan-y;will-change:transform}
.cat-swipe-delete{position:absolute;top:0;right:0;bottom:0;width:80px;background:var(--red);color:#fff;font-weight:700;font-size:12px;border:none}
.cat-edit-sw{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.cat-edit-name{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.cat-edit-name.dim{color:var(--muted);font-weight:500}
.cat-edit-toggle{width:44px;height:26px;border-radius:13px;border:none;background:var(--line);position:relative;flex-shrink:0;transition:background .15s}
.cat-edit-toggle.on{background:var(--green)}
.cat-edit-toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.cat-edit-toggle.on::after{left:20px}
.cat-add-row{display:flex;gap:8px;margin-top:14px}
.cat-add-input{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:13px;padding:10px}
.cat-add-btn{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-soft-line);border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;white-space:nowrap}
.cat-restore-btn{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:12px 0 0;width:100%;text-align:center}
.cat-restore-btn:disabled{opacity:.4;text-decoration:none}

<script src="logic.js"></script>
<script>
const {P, MONTH_NAMES, nextColor, monthKey, defaultCalendarLabel, defaultMonthData, fmt, strip, numVal, pol, arc, contrastTextColor, getWeekBounds} = Logic;
const K="icity-budget-v2";
const PRESET_CATEGORIES=["Спорт","Красота и уход","Образование","Подарки","Ребёнок","Животные","Другое"];

function monthLabel(key){
  const month = STORE.months[key];
  if(month && month.customName) return month.customName;
  const parts = key.split('-');
  if(parts.length===2 && /^\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])){
    const y = +parts[0], m = +parts[1];
    return MONTH_NAMES[m-1]+' '+y;
  }
  return key;
}

let STORE = { months:{}, current:null, deletedMonths:[], order:[], dismissedPresets:[] };
try{
  const r=localStorage.getItem(K);
  if(r){
    const p=JSON.parse(r);
    if(p && typeof p.months==='object') STORE.months=p.months;
    if(p && p.current) STORE.current=p.current;
    if(p && Array.isArray(p.deletedMonths)) STORE.deletedMonths=p.deletedMonths;
    if(p && Array.isArray(p.order)) STORE.order=p.order;
    if(p && Array.isArray(p.dismissedPresets)) STORE.dismissedPresets=p.dismissedPresets;
  }
}catch(e){}

const nowKey = monthKey(new Date());
if(Object.keys(STORE.months).length===0){
  STORE.months[nowKey] = defaultMonthData();
  STORE.current = nowKey;
}

// repairs order/current + fills in fields older/foreign data might be missing.
// Shared by the initial load, "Восстановить из копии", and cloud sync pulls,
// so every entry point into STORE gets the same shape guarantees.
function normalizeStore(store){
  const existing = Object.keys(store.months);
  const known = new Set(store.order);
  const missing = existing.filter(k=>!known.has(k)).sort();
  store.order = store.order.filter(k=>store.months[k]).concat(missing);
  Object.values(store.months).forEach(month=>{
    (month.C||[]).forEach((c,i)=>{
      if(!c.col) c.col = nextColor(month.C.slice(0,i));
    });
    if(!Array.isArray(month.IN)) month.IN = [];
    if(!Array.isArray(month.hiddenC)) month.hiddenC = [];
    if(!Array.isArray(month.EV)) month.EV = [];
  });
  if(!Array.isArray(store.deletedMonths)) store.deletedMonths = [];
  if(!Array.isArray(store.dismissedPresets)) store.dismissedPresets = [];
  if(!store.current || !store.months[store.current]){
    store.current = store.order[store.order.length-1] || Object.keys(store.months)[0];
  }
  return store;
}
normalizeStore(STORE);

// active month's data, aliased for convenience
function cur(){ return STORE.months[STORE.current]; }

const rowsEl=document.getElementById('rows'),svg=document.getElementById('donut'),bi=document.getElementById('bi'),st=document.getElementById('status'),chartCol=document.getElementById('chartCol');
const expandedCategories = new Set();
const limitEditCategories = new Set();
let submitExpenseFor = function(){};
let submitIncome = function(){};
const monthSelect=document.getElementById('monthSelect');
const keyboardActionBar=document.getElementById('keyboardActionBar');
const keyboardActionComment=document.getElementById('keyboardActionComment');
const keyboardActionSubmit=document.getElementById('keyboardActionSubmit');
const undoToast=document.getElementById('undoToast');
const undoToastMessage=document.getElementById('undoToastMessage');
const undoToastBtn=document.getElementById('undoToastBtn');
let activeExpenseIndex=null;
let keyboardActionMode=null;
let lastUndoAction=null;
let undoToastTimer=null;

function hideUndoToast(){
  if(undoToastTimer) clearTimeout(undoToastTimer);
  undoToastTimer=null;
  lastUndoAction=null;
  undoToast.classList.remove('show');
  undoToast.setAttribute('aria-hidden','true');
  undoToast.inert=true;
}
function showUndoToast(message,undoAction){
  if(undoToastTimer) clearTimeout(undoToastTimer);
  lastUndoAction=undoAction;
  undoToastMessage.textContent=message;
  undoToast.classList.add('show');
  undoToast.setAttribute('aria-hidden','false');
  undoToast.inert=false;
  updateUndoToastPosition();
  undoToastTimer=setTimeout(hideUndoToast,6000);
}
function refreshAfterUndo(){
  bi.value=fmt(cur().B);
  renderRows();
  renderChart();
  if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
  if(document.getElementById('catEditorOverlay').classList.contains('open')) renderCatEditor();
  save();
}
undoToastBtn.addEventListener('click',()=>{
  const undoAction=lastUndoAction;
  hideUndoToast();
  if(typeof undoAction==='function') undoAction();
});

// keeps the undo toast from overlapping the comment field/submit button
// when a new expense/income entry is opened while the toast is still showing.
// Uses offsetHeight (a static layout size) rather than getBoundingClientRect
// (the bar's visual position, which is animated via CSS transform and would
// otherwise race with that transition and report a stale position).
function updateUndoToastPosition(){
  if(!undoToast) return;
  if(keyboardActionBar.classList.contains('show')){
    const keyboardInset=parseFloat(keyboardActionBar.style.bottom)||0;
    const gap=10;
    undoToast.style.bottom=(keyboardInset+keyboardActionBar.offsetHeight+gap)+'px';
  } else {
    undoToast.style.bottom='';
  }
}
function updateKeyboardActionBarPosition(){
  if(!keyboardActionBar) return;
  const viewport=window.visualViewport;
  const keyboardInset=viewport ? Math.max(0,window.innerHeight-viewport.height-viewport.offsetTop) : 0;
  keyboardActionBar.style.bottom=keyboardInset+'px';
  updateUndoToastPosition();
}
function showKeyboardActionBar(mode,i){
  const nextMode = mode || 'expense';
  if(keyboardActionMode!==nextMode || activeExpenseIndex!==i) keyboardActionComment.value='';
  keyboardActionMode=nextMode;
  activeExpenseIndex=nextMode==='expense'?i:null;
  keyboardActionSubmit.textContent=nextMode==='income'?'Добавить':'Добавить расход';
  keyboardActionBar.classList.add('show');
  keyboardActionBar.setAttribute('aria-hidden','false');
  keyboardActionBar.inert=false;
  updateKeyboardActionBarPosition();
}
function hideKeyboardActionBar(){
  activeExpenseIndex=null;
  keyboardActionMode=null;
  keyboardActionBar.classList.remove('show');
  keyboardActionBar.setAttribute('aria-hidden','true');
  keyboardActionBar.inert=true;
  keyboardActionBar.style.bottom='0px';
  updateUndoToastPosition();
}
keyboardActionSubmit.addEventListener('pointerdown',e=>e.preventDefault());
keyboardActionSubmit.addEventListener('click',()=>{
  if(keyboardActionMode==='income') submitIncome();
  if(keyboardActionMode==='expense' && activeExpenseIndex!==null) submitExpenseFor(activeExpenseIndex);
});
keyboardActionComment.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key==='Go'||e.key==='Done'){
    e.preventDefault();
    if(keyboardActionMode==='income') submitIncome();
    if(keyboardActionMode==='expense' && activeExpenseIndex!==null) submitExpenseFor(activeExpenseIndex);
  }
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',updateKeyboardActionBarPosition);
  window.visualViewport.addEventListener('scroll',updateKeyboardActionBarPosition);
}
window.addEventListener('resize',updateKeyboardActionBarPosition);

function formatLiveInput(inp){
  const raw = strip(inp.value);
  const parts = raw.split('.');
  const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
  const formatted = parts.length>1 ? intPart+'.'+parts[1] : intPart;
  inp.value = formatted;
}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function save(){
  try{
    localStorage.setItem(K,JSON.stringify(STORE));
    st.textContent="Сохранено ✓";
    st.classList.remove('err');
    setTimeout(()=>st.textContent='',1200);
  }catch(e){
    st.textContent="Ошибка сохранения";
    st.classList.add('err');
  }
  pushToCloud();

function hexToRgba(hex, alpha){
  const h = (hex||'#8884aa').replace('#','');
  const full = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  const n = parseInt(full,16);
  if(isNaN(n)) return `rgba(136,132,170,${alpha})`;
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function addExpense(i, amount, comment){
  const C = cur().C;
  if(!amount || amount<=0) return;
  const category=C[i];
  if(!category) return;
  category.a = (parseFloat(category.a)||0) + amount;
  if(!category.h) category.h=[];
  const entry = {a:amount, d:new Date().toISOString()};
  if(comment && comment.trim()) entry.c = comment.trim();
  category.h.push(entry);
  renderRows();
  renderChart();
  if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
  save();
  showUndoToast(`Расход ${fmt(amount)} добавлен`,()=>{
    const entryIndex=category.h.indexOf(entry);
    if(entryIndex<0) return;
    category.h.splice(entryIndex,1);
    category.a=Math.max(0,(parseFloat(category.a)||0)-(parseFloat(entry.a)||0));
    refreshAfterUndo();
  });
}

function addIncome(amount, comment){
  const m = cur();
  if(!amount || amount<=0) return;
  m.B = (parseFloat(m.B)||0) + amount;
  if(!m.IN) m.IN=[];
  const entry = {a:amount, d:new Date().toISOString()};
  if(comment && comment.trim()) entry.c = comment.trim();
  m.IN.push(entry);
  bi.value = fmt(m.B);
  renderRows();
  renderChart();
  if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
  save();
  showUndoToast(`Доход ${fmt(amount)} добавлен`,()=>{
    const entryIndex=(m.IN||[]).indexOf(entry);
    if(entryIndex<0) return;
    m.IN.splice(entryIndex,1);
    m.B=Math.max(0,(parseFloat(m.B)||0)-(parseFloat(entry.a)||0));
    refreshAfterUndo();
  });
}

function deleteIncome(mk, ii){
  const m = STORE.months[mk];
  if(!m) return;
  const entry = (m.IN||[])[ii];
  if(!entry) return;
  const label = entry.c ? `${fmt(entry.a)} (${entry.c})` : fmt(entry.a);
  if(!confirm(`Удалить доход ${label}? Доходы уменьшатся.`)) return;
  const amount = parseFloat(entry.a)||0;
  m.B = (parseFloat(m.B)||0) - amount;
  m.IN.splice(ii,1);
  if(mk===STORE.current) bi.value = fmt(cur().B);
  renderRows();
  renderChart();
  renderGlobalHist();
  save();
  showUndoToast(`Доход ${fmt(amount)} удалён`,()=>{
    const insertAt=Math.min(ii,m.IN.length);
    m.IN.splice(insertAt,0,entry);
    m.B=(parseFloat(m.B)||0)+amount;
    refreshAfterUndo();
  });
}

function editIncome(mk, ii, newAmount, newComment){
  const m = STORE.months[mk];
  if(!m) return;
  const entry = (m.IN||[])[ii];
  if(!entry) return;
  const oldAmount = parseFloat(entry.a)||0;
  const diff = (newAmount||0) - oldAmount;
  m.B = (parseFloat(m.B)||0) + diff;

  if(!entry.c) delete entry.c;
  if(mk===STORE.current) bi.value = fmt(cur().B);
  renderRows();
  renderChart();
  renderGlobalHist();
  save();
}

function getAllExpenses(){
  const all=[];
  Object.keys(STORE.months).forEach(mk=>{
    const m = STORE.months[mk];
    const mLabel = monthLabel(mk);
    (m.C||[]).forEach((c,ci)=>{
      (c.h||[]).forEach((item,hi)=>{
        all.push({kind:'expense', mk, mLabel, ci, hi, catName:c.n, catColor:c.col || P[ci%P.length], amount:item.a, comment:item.c, date:item.d});
      });
    });
    (m.IN||[]).forEach((item,ii)=>{
      all.push({kind:'income', mk, mLabel, ii, amount:item.a, comment:item.c, date:item.d});
    });
    (m.EV||[]).forEach((ev,evIndex)=>{
      if(ev.type==='del_cat'){
        all.push({kind:'del_cat', mk, mLabel, evIndex, catName:ev.name, amount:ev.amount, h:ev.h||[], date:ev.date, restored:!!ev.restored});
      } else if(ev.type==='add_cat'){
        all.push({kind:'add_cat', mk, mLabel, catName:ev.name, date:ev.date});
      } else if(ev.type==='rename_cat'){
        all.push({kind:'rename_cat', mk, mLabel, oldName:ev.oldName, newName:ev.newName, date:ev.date});
      }
    });
  });
  (STORE.deletedMonths||[]).forEach((dm,dmIndex)=>{
    all.push({kind:'del_month', dmIndex, monthLabel:dm.label, date:dm.date, restored:!!dm.restored});
  });
  all.sort((a,b)=> new Date(b.date) - new Date(a.date));
  return all;
}

function itemSearchText(item){
  switch(item.kind){
    case 'expense': return [item.catName, item.comment, fmt(item.amount), item.mLabel].filter(Boolean).join(' ');
    case 'income': return ['доход', item.comment, fmt(item.amount), item.mLabel].filter(Boolean).join(' ');

    case 'rename_cat': return ['переименование', item.oldName, item.newName, item.mLabel].filter(Boolean).join(' ');

    default: return '';
  }
}

function historyDayKey(iso){
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return 'no-date';
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}
function historyDayLabel(iso){
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return 'Без даты';
  const today=new Date();
  today.setHours(0,0,0,0);
  const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((today-day)/86400000);
  if(diff===0) return 'Сегодня';
  if(diff===1) return 'Вчера';
  const options={day:'numeric',month:'long'};
  if(d.getFullYear()!==today.getFullYear()) options.year='numeric';
  return d.toLocaleDateString('ru-RU',options);
}
function historyTime(iso){
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}

function renderGlobalHist(){
  const ghList = document.getElementById('ghList');
  let all = getAllExpenses();
  if(ghTag!=='all') all = all.filter(item=>tagOf(item.kind)===ghTag);
  if(ghSearchQuery.trim()){
    const q = ghSearchQuery.trim().toLowerCase();
    all = all.filter(item=>itemSearchText(item).toLowerCase().includes(q));
  }
  if(ghExactDate){
    all = all.filter(item=>historyDayKey(item.date)===ghExactDate);
  } else if(ghDateFrom || ghDateTo){
    all = all.filter(item=>{
      const day=historyDayKey(item.date);
      if(day==='no-date') return false;
      if(ghDateFrom && day<ghDateFrom) return false;
      if(ghDateTo && day>ghDateTo) return false;
      return true;
    });
  }
  const foundExpenses=all.filter(item=>item.kind==='expense').reduce((sum,item)=>sum+(parseFloat(item.amount)||0),0);
  const foundIncome=all.filter(item=>item.kind==='income').reduce((sum,item)=>sum+(parseFloat(item.amount)||0),0);
  const summaryHtml=`
    <div class="gh-summary">
      <div class="gh-summary-count">Найдено: ${all.length}</div>
      <div class="gh-summary-totals">
        <span>Расходы <b>${fmt(foundExpenses)}</b></span>
        <span>Доходы <b>${fmt(foundIncome)}</b></span>
      </div>
    </div>`;
  if(all.length===0){
    ghList.innerHTML = summaryHtml+'<div class="gh-empty">Ничего не найдено</div>';
    return;
  }
  let previousDayKey='';
  ghList.innerHTML = summaryHtml+all.map(item=>{
    const dayKey=historyDayKey(item.date);
    const dayHeader=dayKey!==previousDayKey ? `<div class="gh-day-title">${historyDayLabel(item.date)}</div>` : '';
    previousDayKey=dayKey;
    if(item.kind==='add_cat'){
      return `
        ${dayHeader}<div class="gh-item">
          <div class="gh-row">
            <div class="gh-sw" style="background:var(--muted)"></div>
            <div class="gh-cat" style="color:var(--green)">+ категория «${(item.catName||'').replace(/</g,'&lt;')}»</div>
            <div class="gh-date"><span class="gh-month-tag">${item.mLabel||''}</span> ${historyTime(item.date)}</div>
          </div>
        </div>
      `;
    }
    if(item.kind==='rename_cat'){
      return `
        ${dayHeader}<div class="gh-item">
          <div class="gh-row">
            <div class="gh-sw" style="background:var(--muted)"></div>
            <div class="gh-cat" style="color:#e8c96b">переименована «${(item.oldName||'').replace(/</g,'&lt;')}» → «${(item.newName||'').replace(/</g,'&lt;')}»</div>
            <div class="gh-date"><span class="gh-month-tag">${item.mLabel||''}</span> ${historyTime(item.date)}</div>
          </div>
        </div>
      `;
    }

      return `
        ${dayHeader}<div class="gh-item">
          <div class="gh-row">
            <div class="gh-sw" style="background:var(--green)"></div>
            <div class="gh-cat" style="color:var(--green)">доход</div>
            <div class="gh-date"><span class="gh-month-tag">${item.mLabel||''}</span> ${historyTime(item.date)}</div>
          </div>
          ${isEditingIncome ? `
            <div class="gh-editrow">
              <input class="gh-amt-input" type="text" inputmode="decimal" value="${fmt(item.amount)}" data-ghincamt="1">
              <input class="gh-comment-input" type="text" placeholder="комментарий" value="${(item.comment||'').replace(/"/g,'&quot;')}" data-ghinccomment="1">
            </div>
            <div class="gh-editrow">
              <button class="gh-save" data-ghincsave="${item.mk}:${item.ii}">Сохранить</button>
              <button class="gh-del" data-ghincdel="${item.mk}:${item.ii}">Удалить</button>
            </div>
          ` : `
            <div class="gh-editrow" style="justify-content:space-between">
              <div style="font-weight:700">${fmt(item.amount)}${item.comment?` <span style="color:var(--muted);font-weight:400;font-style:italic">— ${item.comment.replace(/</g,'&lt;')}</span>`:''}</div>
              <button class="gh-del gh-edit-icon" data-ghincedit="${item.mk}:${item.ii}" style="color:var(--accent)">✎</button>
            </div>
          `}
        </div>
      `;
    }
    const isEditing = ghEditing && ghEditing.mk===item.mk && ghEditing.ci===item.ci && ghEditing.hi===item.hi;
    return `
      ${dayHeader}<div class="gh-item">
        <div class="gh-row">
          <div class="gh-sw" style="background:${item.catColor}"></div>
          <div class="gh-cat">${(item.catName||'').replace(/</g,'&lt;')}</div>
          <div class="gh-date"><span class="gh-month-tag">${item.mLabel||''}</span> ${historyTime(item.date)}</div>
        </div>
        ${isEditing ? `
          <div class="gh-editrow">
            <input class="gh-amt-input" type="text" inputmode="decimal" value="${fmt(item.amount)}" data-ghamt="1">
            <input class="gh-comment-input" type="text" placeholder="комментарий" value="${(item.comment||'').replace(/"/g,'&quot;')}" data-ghcomment="1">
          </div>
          <div class="gh-editrow">
            <button class="gh-save" data-ghsave="${item.mk}:${item.ci}:${item.hi}">Сохранить</button>
            <button class="gh-del" data-ghdel="${item.mk}:${item.ci}:${item.hi}">Удалить</button>
          </div>
        ` : `
          <div class="gh-editrow" style="justify-content:space-between">
            <div style="font-weight:700">${fmt(item.amount)}${item.comment?` <span style="color:var(--muted);font-weight:400;font-style:italic">— ${item.comment.replace(/</g,'&lt;')}</span>`:''}</div>
            <button class="gh-del gh-edit-icon" data-ghedit="${item.mk}:${item.ci}:${item.hi}" style="color:var(--accent)">✎</button>
          </div>
        `}
      </div>
    `;
  }).join('');
  attachGlobalHist();
}

      if(!m) return;
      const ev = m.EV[evIndex];

      if(!confirm(`Вернуть категорию «${ev.name}» с суммой ${fmt(ev.amount)} и историей трат?`)) return;
      m.C.push({n: ev.name, a: ev.amount, h: ev.h || [], col: nextColor(m.C)});
      ev.restored = true;
      renderRows();
      renderChart();
      renderGlobalHist();
      save();
    });
  });
  document.querySelectorAll('[data-ghrestoremonth]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const dmIndex = +e.target.dataset.ghrestoremonth;
      const dm = STORE.deletedMonths[dmIndex];

      if(!confirm(`Вернуть месяц «${dm.label}» со всеми категориями и историей?`)) return;

      if(!STORE.order.includes(dm.key)) STORE.order.push(dm.key);
      dm.restored = true;
      STORE.current = dm.key;
      renderMonthSelect();
      bi.value = fmt(cur().B);
      renderRows();
      renderChart();
      renderGlobalHist();
      save();
    });
  });
}

function attach(){
  const C = cur().C;
  document.querySelectorAll('.row-top').forEach(rowTop=>{
    rowTop.addEventListener('pointerdown', e=>{
      if(e.pointerType==='mouse' && e.button!==0) return;
      if(e.target.closest('button,input,select,textarea,a')) return;
      const rowEl = rowTop.closest('.row');
      const cat = rowEl._cat;
      const startY = e.clientY;
      const startX = e.clientX;
      let startTop=0, startLeft=0, w=0, h=0, spacer=null, dragging=false;
      const longPressDelay=e.pointerType==='mouse'?220:420;
      const timer=setTimeout(()=>{
        const rect = rowEl.getBoundingClientRect();
        startTop = rect.top; startLeft = rect.left; w = rect.width; h = rect.height;
        spacer = document.createElement('div');
        spacer.className = 'row-spacer';
        spacer.style.height = h+'px';
        rowsEl.insertBefore(spacer, rowEl);
        rowEl.style.position='fixed';
        rowEl.style.top = startTop+'px';
        rowEl.style.left = startLeft+'px';
        rowEl.style.width = w+'px';
        rowEl.style.zIndex = 1000;
        rowEl.classList.add('row-dragging');
        dragging=true;
        try{ rowTop.setPointerCapture(e.pointerId); }catch(err){}
      },longPressDelay);

      function onMove(ev){
        const moveX = Math.abs(ev.clientX-startX);
        const moveY = Math.abs(ev.clientY-startY);
        if(!dragging && (moveX>8 || moveY>8)){
          clearTimeout(timer);
          cleanup(false);
          return;
        }
        if(!dragging) return;
        ev.preventDefault();
        const dy = ev.clientY - startY;
        rowEl.style.top = (startTop+dy)+'px';
        const sibs = Array.from(rowsEl.children).filter(el=>el!==rowEl && el!==spacer);
        let targetEl = null;
        for(const el of sibs){
          const r = el.getBoundingClientRect();
          if(ev.clientY < r.top + r.height/2){ targetEl = el; break; }
        }
        if(targetEl){
          if(spacer.nextSibling !== targetEl) rowsEl.insertBefore(spacer, targetEl);
        } else {
          if(spacer !== rowsEl.lastElementChild) rowsEl.appendChild(spacer);
        }
      }
      function cleanup(saveOrder, ev){
        clearTimeout(timer);
        try{ if(ev) rowTop.releasePointerCapture(ev.pointerId); }catch(err){}
        rowTop.removeEventListener('pointermove', onMove);
        rowTop.removeEventListener('pointerup', onUp);
        rowTop.removeEventListener('pointercancel', onCancel);
        if(!dragging) return;
        dragging=false;
        rowEl.classList.remove('row-dragging');
        rowEl.style.position='';
        rowEl.style.top='';
        rowEl.style.left='';
        rowEl.style.width='';
        rowEl.style.zIndex='';
        if(!saveOrder && spacer){
          rowsEl.insertBefore(rowEl, spacer);
          spacer.remove();
        }
        if(saveOrder && spacer) spacer.remove();
      }
      function onUp(ev){
        if(!dragging){
          cleanup(false,ev);
          return;
        }
        const order = Array.from(rowsEl.children).filter(el=>el!==rowEl);
        const newC = order.map(el => el===spacer ? cat : el._cat);
        cur().C = newC;
        cleanup(true,ev);
        renderRows();
        renderChart();
        sched();
      }
      function onCancel(ev){
        cleanup(false,ev);
      }
      rowTop.addEventListener('pointermove', onMove);
      rowTop.addEventListener('pointerup', onUp);
      rowTop.addEventListener('pointercancel', onCancel);
    });
  });
  document.querySelectorAll('[data-rowtoggle]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=+btn.dataset.rowtoggle;
      const category=C[i];
      if(!category) return;
      const isOpen=expandedCategories.has(category);
      if(isOpen){
        expandedCategories.delete(category);
        limitEditCategories.delete(category);
        hideKeyboardActionBar();
        const hist=document.getElementById('hist-'+i);
        if(hist) hist.classList.remove('open');
      } else {
        expandedCategories.clear();
        limitEditCategories.clear();
        cancelIncomeEntry();
        expandedCategories.add(category);
      }
      renderRows();
      if(!isOpen){
        showKeyboardActionBar('expense',i);
        const input=document.querySelector(`.plus-input[data-i="${i}"]`);
        if(input){
          input.focus({preventScroll:true});
          input.select();
        }
      }
    });
  });
  function updatePctPreview(i){
    const inp = document.querySelector(`.plus-input[data-i="${i}"]`);
    const pctBtn = document.querySelector(`.pct-toggle-btn[data-i="${i}"]`);
    const preview = document.getElementById(`pctPreview-${i}`);
    if(!inp || !pctBtn || !preview) return;
    if(pctBtn.classList.contains('active')){
      const raw = numVal(inp.value);
      const m = cur();
      const budgetTotal = parseFloat(m.B)||0;
      const amount = Math.round(budgetTotal * raw/100);
      preview.textContent = raw>0 ? `= ${fmt(amount)}` : '';
    } else {
      preview.textContent = '';
    }
  }
  submitExpenseFor = function(i){
    const inp=document.querySelector(`.plus-input[data-i="${i}"]`);
    const pctBtn=document.querySelector(`.pct-toggle-btn[data-i="${i}"]`);
    if(!inp) return;
    const raw = numVal(inp.value);
    if(raw<=0){ inp.focus(); return; }
    const m = cur();
    const budgetTotal = parseFloat(m.B)||0;
    const val = pctBtn && pctBtn.classList.contains('active') ? Math.round(budgetTotal * raw/100) : raw;
    if(val<=0){ inp.focus(); return; }
    const comment=keyboardActionMode==='expense' && activeExpenseIndex===i ? keyboardActionComment.value : '';
    const category=cur().C[i];
    inp.blur();
    if(category){
      expandedCategories.delete(category);
      limitEditCategories.delete(category);
    }
    keyboardActionComment.value='';
    hideKeyboardActionBar();
    addExpense(i, val, comment);
  }
  document.querySelectorAll('[data-plusform]').forEach(form=>{
    form.addEventListener('submit',e=>{ e.preventDefault(); });
  });
  document.querySelectorAll('[data-pcttoggle]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i = +btn.dataset.i;
      const inp = document.querySelector(`.plus-input[data-i="${i}"]`);
      const active = btn.classList.toggle('active');
      inp.placeholder = active ? '% от доходов' : 'Сумма';
      const digits = strip(inp.value);
      if(active){
        inp.value = digits ? digits+'%' : '';
      } else {
        formatLiveInput(inp);
      }
      updatePctPreview(i);
    });
  });
  document.querySelectorAll('[data-plus]').forEach(inp=>{
    inp.addEventListener('focus',e=>showKeyboardActionBar('expense',+e.target.dataset.i));
    inp.addEventListener('input',e=>{
      const i=+e.target.dataset.i;
      const pctBtn=document.querySelector(`.pct-toggle-btn[data-i="${i}"]`);
      if(pctBtn && pctBtn.classList.contains('active')){
        const digits = strip(e.target.value);
        e.target.value = digits ? digits+'%' : '';
      } else {
        formatLiveInput(e.target);
      }
      updatePctPreview(i);
    });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key==='Go'||e.key==='Done'){
        e.preventDefault();
        const i=+e.target.dataset.i;
        submitExpenseFor(i);
      }
    });
  });
  document.querySelectorAll('[data-histbtn]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const i=+btn.dataset.i;
      document.getElementById('hist-'+i).classList.toggle('open');
    });
  });
  function saveCategoryLimit(i){
    const inp=document.querySelector(`[data-limitinput="${i}"]`);
    const c=C[i];
    if(!inp || !c) return;
    const hadLimit=Object.prototype.hasOwnProperty.call(c,'limit');
    const oldLimit=c.limit;
    const num=numVal(inp.value);
    if(num>0){ c.limit=num; } else { delete c.limit; }
    limitEditCategories.delete(c);
    renderRows(); renderChart(); sched();
    const newLimit=num>0?num:null;
    const oldNormalized=hadLimit && Number(oldLimit)>0?Number(oldLimit):null;
    if(newLimit!==oldNormalized){
      showUndoToast(newLimit===null?'Лимит отключён':`Лимит ${fmt(newLimit)} установлен`,()=>{
        if(hadLimit){ c.limit=oldLimit; } else { delete c.limit; }
        limitEditCategories.delete(c);
        refreshAfterUndo();
      });
    }
  }
  document.querySelectorAll('[data-limitbtn]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=+btn.dataset.i;
      const c=C[i];
      if(!c) return;
      if(!limitEditCategories.has(c)){
        limitEditCategories.clear();
        limitEditCategories.add(c);
        cancelIncomeEntry();
        hideKeyboardActionBar();
        renderRows();
        const inp=document.querySelector(`[data-limitinput="${i}"]`);
        if(inp){
          inp.focus({preventScroll:true});
          inp.select();
        }
      } else {
        saveCategoryLimit(i);
      }
    });
  });
  document.querySelectorAll('[data-limitinput]').forEach(inp=>{
    inp.addEventListener('input',e=>formatLiveInput(e.target));
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key==='Go'||e.key==='Done'){
        e.preventDefault();
        saveCategoryLimit(+e.target.dataset.limitinput);
      }
    });
  });
  document.querySelectorAll('[data-commenttoggle]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.target.classList.toggle('expanded');
    });
  });
  document.querySelectorAll('.hist-del').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const i=+e.target.dataset.i, hi=+e.target.dataset.hi;
      deleteExpense(STORE.current, i, hi);
      if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
    });
  });
}

function attachCatSwipe(list){
  const SWIPE_W = 80;
  list.querySelectorAll('[data-swipeitem]').forEach(content=>{
    let startX=0, startY=0, dx=0, dragging=false, decided=false, isHorizontal=false, pointerId=null;
    content.addEventListener('pointerdown', e=>{
      // Buttons must receive a normal tap. Capturing their pointer here can
      // redirect the final click to the swipe row on touch devices.
      if(e.target.closest('button,input,select,textarea,a')) return;
      startX = e.clientX; startY = e.clientY; dx=0; dragging=true; decided=false; isHorizontal=false;
      pointerId = e.pointerId;
      content.style.transition='none';
    });
    content.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const rawDx = e.clientX - startX;
      const rawDy = e.clientY - startY;
      if(!decided){
        if(Math.abs(rawDx) > 6 || Math.abs(rawDy) > 6){
          decided = true;
          isHorizontal = Math.abs(rawDx) > Math.abs(rawDy);
          if(isHorizontal){
            try{ content.setPointerCapture(pointerId); }catch(err){}
          }
        } else {
          return;
        }
      }
      if(!isHorizontal) return;
      e.preventDefault();
      const currentOpen = content.classList.contains('swiped') ? -SWIPE_W : 0;
      dx = Math.min(0, Math.max(-SWIPE_W, currentOpen + rawDx));
      content.style.transform = `translateX(${dx}px)`;
    });
    function endDrag(){
      if(!dragging) return;
      dragging=false;
      try{
        if(pointerId!=null && content.hasPointerCapture(pointerId)) content.releasePointerCapture(pointerId);
      }catch(err){}
      pointerId=null;
      content.style.transition='transform .18s ease';
      if(isHorizontal){
        if(dx < -SWIPE_W/2){
          content.style.transform = `translateX(-${SWIPE_W}px)`;
          content.classList.add('swiped');
        } else {
          content.style.transform = 'translateX(0)';
          content.classList.remove('swiped');
        }
      }
    }
    content.addEventListener('pointerup', endDrag);
    content.addEventListener('pointercancel', endDrag);
  });
}

// ---------------- Cloud sync (Firestore, via window.CloudSync from the module script below) ----------------
const SYNC_KEY = 'icity-budget-sync-code';
let syncCode = null;
try{ syncCode = localStorage.getItem(SYNC_KEY) || null; }catch(e){}
let syncUnsubscribe = null;
let applyingRemoteUpdate = false;
let syncBusy = false;
let syncStatus = '';
let syncStatusErr = false;
let syncPanelOpen = false;

const syncBtn = document.getElementById('syncBtn');
const syncPanel = document.getElementById('syncPanel');

function generateSyncCode(){
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L ambiguity
  const bytes = new Uint8Array(20);
  crypto.getRandomValues(bytes);
  let raw = '';
  for(let i=0;i<bytes.length;i++) raw += alphabet[bytes[i] % alphabet.length];
  return raw.match(/.{1,5}/g).join('-');
}

function pushToCloud(){
  if(!syncCode || !window.CloudSync || applyingRemoteUpdate) return;
  const payload = JSON.parse(JSON.stringify({store: STORE, updatedAt: Date.now()}));
  window.CloudSync.setBudgetDoc(syncCode, payload).catch(err=>{
    syncStatus = 'Не удалось отправить изменения в облако: '+err.message;
    syncStatusErr = true;
    if(syncPanelOpen) renderSyncPanel();
  });
}

function applyRemoteStore(remoteStore){
  applyingRemoteUpdate = true;
  try{
    STORE = remoteStore;
    if(Object.keys(STORE.months||{}).length===0){
      STORE.months = STORE.months || {};
      STORE.months[monthKey(new Date())] = defaultMonthData();
      STORE.order = [monthKey(new Date())];
    }
    normalizeStore(STORE);
    expandedCategories.clear();
    limitEditCategories.clear();
    hideKeyboardActionBar();
    renderMonthSelect();
    bi.value = fmt(cur().B);
    renderRows();
    renderChart();
    if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
    if(document.getElementById('catEditorOverlay').classList.contains('open')) renderCatEditor();
    try{ localStorage.setItem(K, JSON.stringify(STORE)); }catch(e){}
  } finally {
    applyingRemoteUpdate = false;
  }
}

function startSync(code){
  if(syncUnsubscribe){ syncUnsubscribe(); syncUnsubscribe = null; }
  syncCode = code;
  try{ localStorage.setItem(SYNC_KEY, code); }catch(e){}
  syncUnsubscribe = window.CloudSync.subscribeBudgetDoc(code, (data, meta)=>{
    if(meta && meta.error){
      syncStatus = 'Ошибка синхронизации: '+meta.error.message;
      syncStatusErr = true;
      if(syncPanelOpen) renderSyncPanel();
      return;
    }
    if(meta && meta.fromLocalWrite) return; // our own pending write echoing back — ignore
    if(!data || !data.store) return; // doc not created yet
    applyRemoteStore(data.store);
    syncStatus = 'Синхронизировано только что';
    syncStatusErr = false;
    if(syncPanelOpen) renderSyncPanel();
  });
}

function stopSync(){
  if(syncUnsubscribe){ syncUnsubscribe(); syncUnsubscribe = null; }
  syncCode = null;
  try{ localStorage.removeItem(SYNC_KEY); }catch(e){}
  syncStatus = '';
  syncStatusErr = false;
}

async function createSyncCode(){
  if(!window.CloudSync || syncBusy) return;
  syncBusy = true;
  renderSyncPanel();
  const code = generateSyncCode();
  try{
    await window.CloudSync.setBudgetDoc(code, JSON.parse(JSON.stringify({store: STORE, updatedAt: Date.now()})));
    startSync(code);
    syncStatus = 'Код создан. Введите его на других устройствах в этом же меню.';
    syncStatusErr = false;
  }catch(err){
    syncStatus = 'Не удалось создать синхронизацию: '+err.message;
    syncStatusErr = true;
  }
  syncBusy = false;
  renderSyncPanel();
}

async function joinSyncCode(rawCode){
  if(!window.CloudSync || syncBusy) return;
  const code = rawCode.trim().toUpperCase();
  if(!code) return;
  syncBusy = true;
  syncStatus = 'Подключение…';
  syncStatusErr = false;
  renderSyncPanel();
  try{
    const existing = await window.CloudSync.getBudgetDoc(code);
    if(existing && existing.store){
      if(!confirm('На этом коде уже есть данные. Заменить текущие локальные данные этого устройства данными с других устройств?')){
        syncBusy = false;
        syncStatus = '';
        renderSyncPanel();
        return;
      }
      startSync(code);
      applyRemoteStore(existing.store);
      syncStatus = 'Подключено, данные загружены.';
    } else {
      if(!confirm('По этому коду в облаке ещё ничего нет. Загрузить туда текущие данные этого устройства как первую копию?')){
        syncBusy = false;
        syncStatus = '';
        renderSyncPanel();
        return;
      }
      await window.CloudSync.setBudgetDoc(code, JSON.parse(JSON.stringify({store: STORE, updatedAt: Date.now()})));
      startSync(code);
      syncStatus = 'Подключено, текущие данные загружены в облако.';
    }
    syncStatusErr = false;
  }catch(err){
    syncStatus = 'Не удалось подключиться: '+err.message;
    syncStatusErr = true;
  }
  syncBusy = false;
  renderSyncPanel();
}

function disconnectSync(){
  if(!confirm('Отключить синхронизацию на этом устройстве? Локальные данные останутся, облачная копия не удаляется.')) return;
  stopSync();
  renderSyncPanel();
}

function renderSyncPanel(){
  if(!window.CloudSync){
    syncPanel.innerHTML = `<div class="sync-status">Загрузка модуля синхронизации…</div>`;
    return;
  }
  if(syncCode){
    syncPanel.innerHTML = `
      <div class="backup-option-desc">Код синхронизации — храните как пароль, введите его на других устройствах в этом же меню:</div>
      <div class="sync-code-box">
        <span class="sync-code-text">${syncCode}</span>
        <button class="period-rename-save" type="button" id="syncCopyBtn" style="flex-shrink:0">Копировать</button>
      </div>
      ${syncStatus ? `<div class="sync-status${syncStatusErr?' err':''}">${syncStatus}</div>` : ''}
      <button class="backup-option danger" type="button" id="syncDisconnectBtn" style="border-radius:11px">
        <div class="backup-option-text"><div class="backup-option-title">Отключить синхронизацию</div><div class="backup-option-desc">Локальные данные останутся на устройстве</div></div>
      </button>
    `;
    document.getElementById('syncCopyBtn').addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(syncCode);
        syncStatus = 'Код скопирован';
        syncStatusErr = false;
      }catch(e){
        syncStatus = 'Не удалось скопировать — выделите код вручную';
        syncStatusErr = true;
      }
      renderSyncPanel();
    });
    document.getElementById('syncDisconnectBtn').addEventListener('click', disconnectSync);
  } else {
    syncPanel.innerHTML = `
      <div class="backup-option-desc">Создайте код на этом устройстве и введите его на остальных — данные станут общими и будут обновляться в реальном времени.</div>
      <button class="period-rename-save" type="button" id="syncCreateBtn" ${syncBusy?'disabled':''}>Создать код синхронизации</button>
      <div class="sync-join-row">
        <input class="period-rename-input" type="text" id="syncJoinInput" placeholder="Код с другого устройства" autocomplete="off" ${syncBusy?'disabled':''}>
        <button class="period-rename-save" type="button" id="syncJoinBtn" ${syncBusy?'disabled':''}>Подключить</button>
      </div>
      ${syncStatus ? `<div class="sync-status${syncStatusErr?' err':''}">${syncStatus}</div>` : ''}
    `;
    document.getElementById('syncCreateBtn').addEventListener('click', createSyncCode);
    document.getElementById('syncJoinBtn').addEventListener('click', ()=>{
      joinSyncCode(document.getElementById('syncJoinInput').value);
    });
    document.getElementById('syncJoinInput').addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); joinSyncCode(e.target.value); }
    });
  }
}

function closeSyncPanel(){
  syncPanelOpen = false;
  syncPanel.classList.remove('open');
  syncBtn.setAttribute('aria-expanded','false');
}
syncBtn.addEventListener('click', ()=>{
  syncPanelOpen = !syncPanelOpen;
  syncPanel.classList.toggle('open', syncPanelOpen);
  syncBtn.setAttribute('aria-expanded', syncPanelOpen ? 'true' : 'false');
  if(syncPanelOpen) renderSyncPanel();
});
window.addEventListener('cloudsync-ready', ()=>{
  if(syncPanelOpen) renderSyncPanel();
  if(syncCode) startSync(syncCode); // resume sync from a previous session
});
if(window.CloudSync && syncCode){
  startSync(syncCode);
}

document.getElementById('ghClose').addEventListener('click',()=>{
  document.getElementById('ghOverlay').classList.remove('open');
});
document.getElementById('ghOverlay').addEventListener('click',e=>{
  if(e.target.id==='ghOverlay'){
    document.getElementById('ghOverlay').classList.remove('open');
    return;
  }
  if(e.target.closest('button,input,select,textarea,a')) return;
  const activeElement=document.activeElement;
  if(activeElement && e.currentTarget.contains(activeElement) && typeof activeElement.blur==='function') activeElement.blur();
  if(ghDateFilters.classList.contains('open')){
    ghDateFilters.classList.remove('open');
    ghDateToggle.classList.remove('open');
    ghDateToggle.setAttribute('aria-expanded','false');
  }
  if(ghEditing){
    ghEditing=null;
    renderGlobalHist();
  }
});
document.querySelectorAll('[data-ghtag]').forEach(btn=>{
  btn.addEventListener('click',e=>{
    ghTag = e.target.dataset.ghtag;
    document.querySelectorAll('[data-ghtag]').forEach(b=>b.classList.toggle('active', b===e.target));
    ghEditing = null;
    renderGlobalHist();
  });
});
document.getElementById('ghSearch').addEventListener('input',e=>{
  ghSearchQuery = e.target.value;
  ghEditing = null;
  renderGlobalHist();
});
const ghExactDateInput=document.getElementById('ghExactDate');
const ghDateFromInput=document.getElementById('ghDateFrom');
const ghDateToInput=document.getElementById('ghDateTo');
const ghDateToggle=document.getElementById('ghDateToggle');
const ghDateFilters=document.getElementById('ghDateFilters');
function syncGhDateToggle(){
  ghDateToggle.classList.toggle('filtered',!!(ghExactDate||ghDateFrom||ghDateTo));
}
ghDateToggle.addEventListener('click',()=>{
  const open=ghDateFilters.classList.toggle('open');
  ghDateToggle.classList.toggle('open',open);
  ghDateToggle.setAttribute('aria-expanded',open?'true':'false');
});
ghExactDateInput.addEventListener('change',e=>{
  ghExactDate=e.target.value;
  if(ghExactDate){
    ghDateFrom='';
    ghDateTo='';
    ghDateFromInput.value='';
    ghDateToInput.value='';
  }
  ghEditing=null;
  syncGhDateToggle();
  renderGlobalHist();
});
ghDateFromInput.addEventListener('change',e=>{
  ghDateFrom=e.target.value;
  ghExactDate='';
  ghExactDateInput.value='';
  if(ghDateFrom && ghDateTo && ghDateFrom>ghDateTo){
    ghDateTo=ghDateFrom;
    ghDateToInput.value=ghDateTo;
  }
  ghEditing=null;
  syncGhDateToggle();
  renderGlobalHist();
});
ghDateToInput.addEventListener('change',e=>{
  ghDateTo=e.target.value;
  ghExactDate='';
  ghExactDateInput.value='';
  if(ghDateFrom && ghDateTo && ghDateTo<ghDateFrom){
    ghDateFrom=ghDateTo;
    ghDateFromInput.value=ghDateFrom;
  }
  ghEditing=null;
  syncGhDateToggle();
  renderGlobalHist();
});
document.getElementById('ghDateClear').addEventListener('click',()=>{
  ghExactDate='';
  ghDateFrom='';
  ghDateTo='';
  ghExactDateInput.value='';
  ghDateFromInput.value='';
  ghDateToInput.value='';
  ghEditing=null;
  syncGhDateToggle();
  renderGlobalHist();
});

const THEME_KEY = "icity-budget-theme";
const themeBtn = document.getElementById('themeToggle');
const themeIconSun = document.getElementById('themeIconSun');
const themeIconMoon = document.getElementById('themeIconMoon');
const themeMenuTitle = document.getElementById('themeMenuTitle');
function applyTheme(theme){
  if(theme==='light'){
    document.documentElement.setAttribute('data-theme','light');
    themeIconSun.style.display='none';
    themeIconMoon.style.display='block';
    themeMenuTitle.textContent='Тёмная тема';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeIconSun.style.display='block';
    themeIconMoon.style.display='none';
    themeMenuTitle.textContent='Светлая тема';
  }
  renderChart();
}
let savedTheme = 'light';
try{ savedTheme = localStorage.getItem(THEME_KEY) || 'light'; }catch(e){}

renderMonthSelect();
bi.value = fmt(cur().B);
renderRows();
renderChart();
applyTheme(savedTheme);

themeBtn.addEventListener('click',()=>{
  const current = document.documentElement.getAttribute('data-theme')==='light' ? 'light' : 'dark';
  const next = current==='light' ? 'dark' : 'light';
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  document.getElementById('backupOverlay').classList.remove('open');
});

function toggleChartExpanded(){
  const chartSideEl = document.querySelector('.chart-side');
  const ringEl = document.getElementById('donut');
  ringEl.getAnimations().forEach(animation=>animation.cancel());
  const startRect = ringEl.getBoundingClientRect();
  const next = !chartExpanded;
  chartExpanded = next;
  if(!next) chartPeriod = 'month';
  chartSideEl.classList.toggle('expanded', next);
  renderChart();

  const endRect = ringEl.getBoundingClientRect();
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion && startRect.width && endRect.width){
    const dx = startRect.left - endRect.left;
    const dy = startRect.top - endRect.top;
    const scaleX = startRect.width / endRect.width;
    const scaleY = startRect.height / endRect.height;
    ringEl.animate([
      {transform:`translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})`},
      {transform:'translate(0, 0) scale(1, 1)'}
    ],{
      duration:620,
      easing:'cubic-bezier(.22,1,.36,1)',
      fill:'both'
    });
  }

  if(!next && !reduceMotion){
    chartSideEl.animate([
      {opacity:0, transform:'translateY(8px)'},
      {opacity:1, transform:'translateY(0)'}
    ],{
      duration:320,
      delay:110,
      easing:'cubic-bezier(.22,1,.36,1)',
      fill:'both'
    });
  }
}
svg.addEventListener('click', toggleChartExpanded);

document.addEventListener('click',e=>{
  const openCategoryHistories=Array.from(document.querySelectorAll('.hist.open'));
  const hadExpandedCategory=expandedCategories.size>0;
  const hadIncomeEntry=incomeAmt.classList.contains('show');
  if(!hadExpandedCategory && openCategoryHistories.length===0 && !hadIncomeEntry) return;
  if(e.target.closest('.row,.keyboard-action-bar,.overlay.open')) return;
  if(e.target.closest('.side-income')) return;
  if(e.target.closest('button,input,select,textarea,a')) return;
  openCategoryHistories.forEach(hist=>hist.classList.remove('open'));
  expandedCategories.clear();
  limitEditCategories.clear();
  if(hadIncomeEntry) cancelIncomeEntry();
  hideKeyboardActionBar();
  if(hadExpandedCategory) renderRows();
});

document.querySelectorAll('#periodTabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(chartPeriod===btn.dataset.period) return;
    chartPeriod = btn.dataset.period;
    renderChart();
  });
});

<script type="module">
  // Bridges Firestore (loaded as an ES module) into window.CloudSync so the
  // classic script above — which can't use `import` — can call plain
  // async functions without needing a build step.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDH7z9MvtNHUf0LGBf_aRRDBCU5ij5Cz3A",
    authDomain: "finansy-app-d298b.firebaseapp.com",
    projectId: "finansy-app-d298b",
    storageBucket: "finansy-app-d298b.firebasestorage.app",
    messagingSenderId: "1094409922442",
    appId: "1:1094409922442:web:a47726de701a83d4388a73"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.CloudSync = {
    async getBudgetDoc(code){
      const snap = await getDoc(doc(db, 'budgets', code));
      return snap.exists() ? snap.data() : null;
    },
    async setBudgetDoc(code, data){
      await setDoc(doc(db, 'budgets', code), data);
    },
    // returns an unsubscribe function; callback(data|null, {fromLocalWrite} | {error})
    subscribeBudgetDoc(code, callback){
      return onSnapshot(
        doc(db, 'budgets', code),
        snap => callback(snap.exists() ? snap.data() : null, {fromLocalWrite: snap.metadata.hasPendingWrites}),
        err => callback(null, {error: err})
      );
    }
  };
  window.dispatchEvent(new Event('cloudsync-ready'));
</script>
